# Publishes @wareraprojects/api to npm when a release is published, after the
# type checks, unit tests and build pass. A pre-release goes out under the `next`
# dist-tag, so `npm install @wareraprojects/api` keeps resolving to the last stable release.

name: Publish @wareraprojects/api

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    # A manual run publishes only from main.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN_WARERA}}
